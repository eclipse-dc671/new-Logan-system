<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Eclipse Portal</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@600;700&family=Plus+Jakarta+Sans:wght@400;500;600&display=swap" rel="stylesheet">
  
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- बैकग्राउंड लेयर: कैट इमेज या GIF -->
  <div class="wallpaper-layer" id="wallpaperLayer"></div>

  <!-- स्नो और वेव एनीमेशन कैनवस -->
  <canvas id="animCanvas"></canvas>

  <!-- ऊपर का कंट्रोल बार (कलर पैलेट + बैकग्राउंड टॉगल) -->
  <header class="top-nav">
    <div class="palette-group" id="paletteGroup"></div>
    
    <label class="custom-dot" title="Custom Color">
      <input type="color" id="customColor" value="#00ff66">
    </label>

    <button type="button" class="switch-bg-btn" onclick="toggleBackground()" title="Switch Wallpaper">
      🎬 Mode
    </button>
  </header>

  <!-- कट-कॉर्नर कार्ड -->
  <main class="portal-card-box">
    <div class="cut-border">
      <section class="cut-content">
        
        <h1 id="portalHeading">Welcome <span>Back</span></h1>
        <p class="subtitle" id="portalSub">Enter your credentials to access your secure account</p>

        <form id="loginForm" onsubmit="handleAuth(event)">
          
          <div class="input-row" id="nameRow" style="display: none;">
            <label for="fullName">Full Name</label>
            <div class="field-box">
              <input type="text" id="fullName" placeholder="Alex Johnson">
            </div>
          </div>

          <div class="input-row">
            <label for="emailAddr">Email Address</label>
            <div class="field-box">
              <input type="email" id="emailAddr" placeholder="name@domain.com" required>
            </div>
          </div>

          <div class="input-row">
            <label for="passWord">Password</label>
            <div class="field-box">
              <input type="password" id="passWord" placeholder="••••••••" required>
              <button type="button" class="eye-toggle" onclick="togglePasswordVisibility()">👁️</button>
            </div>
          </div>

          <div class="card-options">
            <label class="remember-label">
              <input type="checkbox" id="saveSession" checked> Remember me
            </label>
            <button type="button" class="forgot-btn" id="forgotBtn" onclick="sendResetLink()">Forgot password?</button>
          </div>

          <button type="submit" class="submit-action" id="actionBtn">
            Sign In ➔
          </button>
        </form>

        <div class="separator">OR CONTINUE WITH</div>

        <!-- 4 मुख्य सोशल लॉगिन -->
        <div class="oauth-grid">
          <button type="button" class="oauth-item" onclick="socialAuth('Google')">
            <svg viewBox="0 0 24 24"><path fill="#EA4335" d="M12 10.2v3.9h5.5c-.2 1.3-1.6 3.8-5.5 3.8a6 6 0 0 1 0-12c1.9 0 3.1.8 3.8 1.5l2.6-2.5A9.6 9.6 0 0 0 12 2.4a9.6 9.6 0 1 0 0 19.2c5.5 0 9.2-3.9 9.2-9.3 0-.6-.1-1.1-.2-1.6H12Z"/></svg>
            Google
          </button>

          <button type="button" class="oauth-item" onclick="socialAuth('Apple')">
            <svg viewBox="0 0 24 24" fill="#ffffff"><path d="M18.71 19.5c-.83 1.24-1.71 2.45-3.05 2.47-1.34.03-1.77-.79-3.29-.79-1.53 0-2 .77-3.27.82-1.31.05-2.3-1.32-3.14-2.53C4.25 17 2.94 12.45 4.7 9.39c.87-1.52 2.43-2.48 4.12-2.51 1.28-.02 2.5.87 3.29.87.78 0 2.26-1.07 3.81-.91.65.03 2.47.26 3.64 1.98-.09.06-2.17 1.28-2.15 3.81.03 3.02 2.65 4.03 2.68 4.04-.03.07-.42 1.44-1.38 2.83M15.97 6.37c.64-.78 1.08-1.86.96-2.95-1 .04-2.13.66-2.8 1.45-.58.68-1.1 1.77-.96 2.84 1.11.09 2.17-.56 2.8-1.34z"/></svg>
            Apple
          </button>

          <button type="button" class="oauth-item" onclick="socialAuth('Discord')">
            <svg viewBox="0 0 24 24" fill="#5865F2"><path d="M20.317 4.37a19.791 19.791 0 0 0-4.885-1.515.074.074 0 0 0-.079.037c-.21.375-.444.864-.608 1.25a18.27 18.27 0 0 0-5.487 0 12.64 12.64 0 0 0-.617-1.25.077.077 0 0 0-.079-.037A19.736 19.736 0 0 0 3.677 4.37a.07.07 0 0 0-.032.027C.533 9.046-.32 13.58.099 18.057a.082.082 0 0 0 .031.057 19.9 19.9 0 0 0 5.993 3.03.078.078 0 0 0 .084-.028c.462-.63.874-1.295 1.226-1.994.021-.041.001-.09-.041-.106a13.107 13.107 0 0 1-1.872-.892.077.077 0 0 1-.008-.128 10.2 10.2 0 0 0 .372-.292.074.074 0 0 1 .077-.01c3.929 1.793 8.18 1.793 12.061 0a.074.074 0 0 1 .078.01c.12.098.246.198.373.292a.077.077 0 0 1-.006.127 12.299 12.299 0 0 1-1.873.894.077.077 0 0 0-.041.107c.36.698.772 1.362 1.225 1.993a.076.076 0 0 0 .084.028 19.839 19.839 0 0 0 6.002-3.03.077.077 0 0 0 .032-.054c.5-5.177-.838-9.674-3.549-13.66a.061.061 0 0 0-.031-.028zM8.02 15.33c-1.183 0-2.157-1.085-2.157-2.419 0-1.333.956-2.419 2.157-2.419 1.21 0 2.176 1.096 2.157 2.42 0 1.333-.956 2.418-2.157 2.418zm7.975 0c-1.183 0-2.157-1.085-2.157-2.419 0-1.333.955-2.419 2.157-2.419 1.21 0 2.176 1.096 2.157 2.42 0 1.333-.946 2.418-2.157 2.418z"/></svg>
            Discord
          </button>

          <button type="button" class="oauth-item" onclick="socialAuth('GitHub')">
            <svg viewBox="0 0 24 24" fill="#ffffff"><path fill-rule="evenodd" clip-rule="evenodd" d="M12 2C6.477 2 2 6.484 2 12.017c0 4.425 2.865 8.18 6.839 9.504.5.092.682-.217.682-.483 0-.237-.008-.868-.013-1.703-2.782.605-3.369-1.343-3.369-1.343-.454-1.158-1.11-1.466-1.11-1.466-.908-.62.069-.608.069-.608 1.003.07 1.53 1.032 1.53 1.032.892 1.53 2.341 1.088 2.91.832.092-.647.35-1.088.636-1.338-2.22-.253-4.555-1.113-4.555-4.951 0-1.093.39-1.988 1.029-2.688-.103-.253-.446-1.272.098-2.65 0 0 .84-.27 2.75 1.026A9.564 9.564 0 0112 6.844c.85.004 1.705.115 2.504.337 1.909-1.296 2.747-1.027 2.747-1.027.546 1.379.202 2.398.1 2.651.64.7 1.028 1.595 1.028 2.688 0 3.848-2.339 4.695-4.566 4.943.359.309.678.92.678 1.855 0 1.338-.012 2.419-.012 2.747 0 .268.18.58.688.482A10.019 10.019 0 0022 12.017C22 6.484 17.522 2 12 2z"/></svg>
            GitHub
          </button>
        </div>

        <div class="mode-toggle-area">
          <span id="promptTxt">Don't have an account?</span>
          <button type="button" class="link-btn" id="swapBtn" onclick="swapFormMode()">Sign Up</button>
        </div>

      </section>
    </div>
  </main>

  <div class="toast-popup" id="toastPopup"></div>

  <script src="script.js"></script>
</body>
</html>
